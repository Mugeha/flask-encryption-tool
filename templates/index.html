<!DOCTYPE html>
<html>
<head>
    <title>🔐 Web Encryptor</title>
    <style>
        body {
            font-family: Arial;
            background-color: #1e1e2f;
            color: white;
            padding: 40px;
            text-align: center;
        }
        textarea {
            width: 80%;
            height: 120px;
            font-size: 16px;
            margin-bottom: 15px;
            padding: 10px;
        }
        .btn {
            padding: 10px 20px;
            margin: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .encrypt { background-color: #28a745; color: white; }
        .decrypt { background-color: #007bff; color: white; }
        .result {
            background-color: #f8f9fa;
            color: #333;
            padding: 10px;
            margin-top: 20px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🔐 Web Encryption & Decryption Tool</h1>

    <!-- Encrypt Form -->
    <form method="POST" action="/encrypt">
        <textarea name="text" placeholder="Enter text to encrypt..."></textarea><br>
        <button type="submit" class="btn encrypt">Encrypt</button>
    </form>

    <!-- Decrypt Form -->
    <form method="POST" action="/decrypt">
        <textarea name="text" placeholder="Enter text to decrypt..."></textarea><br>
        <button type="submit" class="btn decrypt">Decrypt</button>
    </form>

    {% if result %}
    <div class="result">
        <strong>{{ mode }} Result:</strong><br>
        <pre>{{ result }}</pre>
    </div>
    {% endif %}
</body>
</html>
